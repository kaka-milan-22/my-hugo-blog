baseURL = "https://blog.kakacn.com/"
languageCode = "zh-cn"
title = "Kaka's Blog"
enableRobotsTXT = true

defaultContentLanguage = "zh"
hasCJKLanguage = true

[pagination]
  pagerSize = 5

# ---------------- 模块 ----------------
[module]
  [[module.imports]]
    path = "github.com/hugo-sid/hugo-blog-awesome"

# ---------------- 代码高亮 ----------------
[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = true

# ---------------- 输出格式 ----------------
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# ---------------- 站点参数 ----------------
[params]
  description = "Kaka 的个人博客，记录 AI、Blockchain、DevOps、足球与生活"
  keywords = ["Kaka", "AI", "Blockchain", "DevOps", "Linux", "云原生", "足球", "个人博客"]
  mainSections = ["posts"]
  toc = true
  enableEmoji = true
  defaultTheme = "auto"
  showReadingTime = true
  showWordCount = true
  showShareButtons = true

# ---------------- 首页 Profile（头像所在） ----------------
[params.profile]
  enable = true
  name = "Kaka"
  subtitle = "AI / Blockchain / DevOps / 足球 / 生活"
  avatar = "/images/avatar.png"

# ---------------- 作者信息（文章页使用） ----------------
[params.author]
  name = "Kaka"
  avatar = "/images/avatar.png"
  intro = "AI / Blockchain / DevOps / 足球 / 生活"
  description = "记录技术实践、足球记忆与生活思考"

# ---------------- 菜单 ----------------
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 2

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 3

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 4

# ---------------- 社交 ----------------
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/kaka-milan-22"

[[params.socialIcons]]
  name = "twitter"
  url = "https://x.com/kaka99859362"

[[params.socialIcons]]
  name = "email"
  url = "mailto:kaka@kakacn.com"

# ---------------- 搜索 ----------------
[params.search]
  enable = true

# ---------------- RSS ----------------
[params.rss]
  fullContent = true

# ---------------- 多语言 ----------------
[languages]
  [languages.zh]
    languageName = "中文"
    weight = 1
    [languages.zh.author]
      name = "Kaka"
      email = "kaka@kakacn.com"

  [languages.en]
    languageName = "English"
    weight = 2
    [languages.en.author]
      name = "Kaka"
      email = "kaka@kakacn.com"
